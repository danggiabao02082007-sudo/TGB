<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thời gian biểu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical, a student's tool used every day
   IDEA: the printed class timetable sheet pinned above a desk, marked with a red pen
   PICTURE: the schedule itself — big hanging times (day) or the weekly grid (week)
   COLOUR and TYPE: paper white / ink black, red-pen accent for "now"; three type colours; Be Vietnam Pro
   LAYOUT: modest title + next-up line, day tabs, schedule fills the screen, floating add button */
:root{color-scheme:light dark;--bg:light-dark(#fbfbf8,#141414);--card:light-dark(#fff,#1e1e1e);--ink:light-dark(#151515,#eeeeea);--mute:light-dark(#6b6b66,#9a9a94);--line:light-dark(#e3e3dd,#2e2e2b);--red:light-dark(#d92d20,#ff5a4e);
--lt:light-dark(#2f5bea,#7b98ff);--th:light-dark(#0b8a7a,#3fcdb9);--ca:light-dark(#c26a00,#f5a524)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px) 110px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05;margin:0;font-weight:700;letter-spacing:-.01em}
.today{color:var(--mute);margin:6px 0 0}
.next{margin:10px 0 0;font-weight:500}.next b{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;padding:0 16px;height:38px;border-radius:999px;color:var(--mute);font-weight:500}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;margin-bottom:6px}
.days button{flex:none;width:54px;height:58px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:grid;place-content:center;line-height:1.15}
.days small{display:block;color:var(--mute);font-size:13px}
.days button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.days button.is-today b{color:var(--red)}
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.t{font-size:26px;font-weight:600;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.t small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:6px}
.ev{text-align:left;width:100%;border:0;background:var(--card);border-radius:12px;padding:12px 14px 12px 18px;position:relative;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.ev::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--c)}
.ev h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.ev p{margin:3px 0 0;color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:500;color:var(--c);margin-right:8px}
.now .ev{box-shadow:0 0 0 2px var(--red)}
.badge{display:inline-block;font-size:13px;font-weight:600;color:var(--red);margin-bottom:2px}
.empty{padding:40px 0;text-align:center;color:var(--mute);border-top:2px solid var(--ink)}
.empty button{margin-top:12px}
.scroll{overflow-x:auto}
.wk{display:grid;grid-template-columns:48px repeat(7,minmax(112px,1fr));min-width:850px;border-top:2px solid var(--ink)}
.wh{position:sticky;top:0;padding:8px 6px;text-align:center;font-weight:600;border-bottom:1px solid var(--line);background:var(--bg);z-index:2}
.wh small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.wh.is-today{color:var(--red)}
.hrs{position:relative}
.hrs span{position:absolute;right:8px;font-size:13px;color:var(--mute);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--px) - 1px),var(--line) calc(var(--px) - 1px) var(--px));cursor:copy}
.col.is-today{background-color:light-dark(#fff5f3,#221714)}
.blk{position:absolute;left:4px;right:4px;border:0;border-radius:8px;padding:5px 7px;text-align:left;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,var(--card));border-left:4px solid var(--c);font-size:13px;line-height:1.3;cursor:pointer}
.blk b{display:block;font-weight:600}
.blk span{color:var(--mute)}
.nowline{position:absolute;left:-1px;right:0;height:2px;background:var(--red);z-index:1;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.foot{margin-top:22px;color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.link{border:0;background:none;padding:0;text-decoration:underline;color:var(--mute);font-size:13px;min-height:32px}
.fab{position:fixed;right:max(4vw,16px);bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 22px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:5}
.btn{height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.del{color:var(--red);margin-right:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:end;justify-content:center;z-index:10}
.ov.open{display:flex}
.dlg{background:var(--bg);width:min(520px,100%);border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.dlg{border-radius:18px}}
.dlg h2{margin:0 0 14px;font-size:22px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 5px}
input,select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types label{margin:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
.types input{width:auto;height:auto;accent-color:var(--c)}
.types label:has(input:checked){border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.warn{color:var(--red);font-size:14px;min-height:22px;margin:10px 0 0}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;gap:14px;align-items:center;z-index:11;white-space:nowrap}
.toast.open{display:flex}.toast button{border:0;background:none;color:var(--bg);font-weight:600;text-decoration:underline;min-height:32px}
@media(max-width:600px){.row{grid-template-columns:68px minmax(0,1fr);gap:12px}.t{font-size:22px}}
@media(prefers-reduced-motion:no-preference){.ov.open .dlg{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
</style></head><body>
<div class="wrap">
<header>
  <div><h1>Thời gian biểu</h1><p class="today" id="today"></p><p class="next" id="next"></p></div>
  <div class="seg" role="group" aria-label="Chế độ xem"><button id="vDay" aria-pressed="true">Ngày</button><button id="vWeek" aria-pressed="false">Tuần</button></div>
</header>
<nav class="days" id="days" aria-label="Chọn thứ"></nav>
<main id="view"></main>
<div class="foot"><span>Dữ liệu mẫu · lưu trên máy này</span><button class="link" id="reset">Khôi phục dữ liệu mẫu</button><button class="link" id="clear">Xoá hết</button></div>
</div>
<button class="fab" id="add">+ Thêm hoạt động</button>

<div class="ov" id="ov"><form class="dlg" id="f" novalidate>
  <h2 id="fh">Thêm hoạt động</h2>
  <label for="fT">Tên hoạt động</label><input id="fT" required placeholder="Ví dụ: Hàm biến phức">
  <div class="two">
    <div><label for="fD">Thứ</label><select id="fD"></select></div>
    <div><label for="fP">Địa điểm</label><input id="fP" placeholder="Phòng, nơi chốn"></div>
  </div>
  <div class="two">
    <div><label for="fS">Bắt đầu</label><input id="fS" type="time" required></div>
    <div><label for="fE">Kết thúc</label><input id="fE" type="time" required></div>
  </div>
  <label>Loại</label>
  <div class="types" id="fK"></div>
  <p class="warn" id="warn" aria-live="polite"></p>
  <div class="acts"><button type="button" class="btn del" id="fDel">Xoá</button><button type="button" class="btn" id="fX">Huỷ</button><button class="btn pri">Lưu</button></div>
</form></div>
<div class="toast" id="toast" role="status"><span id="tm"></span><button id="undo">Hoàn tác</button></div>

<script>{
const DAYS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'],SD=['T2','T3','T4','T5','T6','T7','CN'];
const KINDS={lt:'Lý thuyết',th:'Thực hành',ca:'Cá nhân'};
const SAMPLE=[
['Hàm biến phức',0,'07:30','09:30','Phòng 101','lt'],['Xác suất Thống kê',0,'09:45','11:15','Phòng 204','lt'],['Thực hành Điện tử',0,'13:00','16:00','Phòng thí nghiệm','th'],
['Vật lý hiện đại',1,'07:30','10:00','Phòng 305','lt'],['Sinh hoạt CLB âm nhạc',1,'17:30','19:00','Hội trường','ca'],
['Tự học ở thư viện',2,'08:00','10:30','Thư viện','ca'],['Điện động lực',2,'13:30','16:00','Phòng 102','lt'],
['Xác suất Thống kê',3,'07:30','09:30','Phòng 204','lt'],['Bài tập Hàm biến phức',3,'09:45','11:15','Phòng 101','lt'],
['Điện tử',4,'07:30','10:00','Phòng 206','lt'],['Bài tập Vật lý hiện đại',4,'13:00','14:30','Phòng 305','lt'],
['Ôn tập cả tuần',5,'09:00','11:00','Ở nhà','ca']
].map((a,i)=>({id:'s'+i,title:a[0],day:a[1],start:a[2],end:a[3],place:a[4],kind:a[5]}));
const KEY='tkb-v1',PX=52;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=t=>{const[h,mi]=t.split(':').map(Number);return h*60+mi};
const fmtDur=n=>n<60?n+' phút':Math.floor(n/60)+' giờ'+(n%60?' '+n%60+' phút':'');
let evs=load(),view='day',sel=todayIdx(),editId=null,lastDel=null,tt;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return SAMPLE.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(evs))}catch(e){}}
function todayIdx(){return(new Date().getDay()+6)%7}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
const byDay=d=>evs.filter(e=>e.day===d).sort((a,b)=>m(a.start)-m(b.start));

function head(){
  const d=new Date();
  $('today').textContent='Hôm nay: '+DAYS[todayIdx()]+', '+d.toLocaleDateString('vi-VN');
  const td=todayIdx(),n=nowMin(),cur=byDay(td).find(e=>m(e.start)<=n&&n<m(e.end));
  let up=null;
  for(let k=0;k<7&&!up;k++){const di=(td+k)%7;up=byDay(di).find(e=>k>0||m(e.start)>n);if(up)up={e:up,k}}
  const el=$('next');
  if(cur)el.innerHTML='Đang diễn ra: <b>'+esc(cur.title)+'</b> · còn '+fmtDur(m(cur.end)-n);
  else if(up){const wait=up.k*1440+m(up.e.start)-n;el.innerHTML='Tiếp theo: <b>'+esc(up.e.title)+'</b> lúc '+up.e.start+(up.k?' ('+DAYS[up.e.day]+')':'')+' · còn '+fmtDur(wait)}
  else el.textContent='Chưa có hoạt động nào sắp tới.';
}
function tabs(){
  $('days').style.display=view==='day'?'flex':'none';
  $('days').innerHTML=SD.map((s,i)=>`<button data-d="${i}" aria-pressed="${i===sel}" class="${i===todayIdx()?'is-today':''}"><b>${s}</b><small>${byDay(i).length} mục</small></button>`).join('');
}
function card(e){return `<button class="ev" data-id="${esc(e.id)}" style="--c:var(--${e.kind})"><span class="tag">${KINDS[e.kind]}</span><h3>${esc(e.title)}</h3><p>${esc(e.start)}–${esc(e.end)}${e.place?' · '+esc(e.place):''}</p></button>`}
function dayView(){
  const list=byDay(sel),isT=sel===todayIdx(),n=nowMin();
  if(!list.length)return `<div class="empty">${DAYS[sel]} chưa có hoạt động nào.<br><button class="btn" id="emptyAdd">Thêm hoạt động</button></div>`;
  return '<ul class="list">'+list.map(e=>{const now=isT&&m(e.start)<=n&&n<m(e.end);
    return `<li class="row${now?' now':''}"><div class="t">${esc(e.start)}<small>${esc(e.end)}</small></div><div>${now?'<span class="badge">Đang diễn ra</span>':''}${card(e)}</div></li>`}).join('')+'</ul>';
}
function weekView(){
  let lo=7,hi=21;evs.forEach(e=>{lo=Math.min(lo,Math.floor(m(e.start)/60));hi=Math.max(hi,Math.ceil(m(e.end)/60))});
  const H=(hi-lo)*PX,td=todayIdx(),n=nowMin();
  let h='<div class="scroll"><div class="wk" style="--px:'+PX+'px"><div class="wh"></div>'+DAYS.map((d,i)=>`<div class="wh${i===td?' is-today':''}">${SD[i]}<small>${byDay(i).length} mục</small></div>`).join('');
  h+=`<div class="hrs" style="height:${H}px">`;for(let k=lo+1;k<hi;k++)h+=`<span style="top:${(k-lo)*PX}px">${k}:00</span>`;h+='</div>';
  for(let i=0;i<7;i++){
    h+=`<div class="col${i===td?' is-today':''}" data-d="${i}" data-lo="${lo}" style="height:${H}px" title="Bấm vào chỗ trống để thêm">`;
    h+=byDay(i).map(e=>{const top=(m(e.start)-lo*60)/60*PX,ht=Math.max(22,(m(e.end)-m(e.start))/60*PX-2);
      return `<button class="blk" data-id="${esc(e.id)}" style="--c:var(--${e.kind});top:${top}px;height:${ht}px"><b>${esc(e.title)}</b><span>${esc(e.start)}–${esc(e.end)}${e.place?' · '+esc(e.place):''}</span></button>`}).join('');
    if(i===td&&n>=lo*60&&n<=hi*60)h+=`<div class="nowline" style="top:${(n-lo*60)/60*PX}px"></div>`;
    h+='</div>';
  }
  return h+'</div></div>';
}
function render(){
  $('vDay').setAttribute('aria-pressed',view==='day');$('vWeek').setAttribute('aria-pressed',view==='week');
  head();tabs();$('view').innerHTML=view==='day'?dayView():weekView();
}

$('fD').innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
$('fK').innerHTML=Object.entries(KINDS).map(([k,v])=>`<label style="--c:var(--${k})"><input type="radio" name="k" value="${k}">${v}</label>`).join('');
function open(e,preset){
  editId=e?e.id:null;$('fh').textContent=e?'Sửa hoạt động':'Thêm hoạt động';$('fDel').style.display=e?'':'none';
  const v=e||Object.assign({title:'',day:sel,start:'07:30',end:'09:00',place:'',kind:'lt'},preset);
  $('fT').value=v.title;$('fD').value=v.day;$('fS').value=v.start;$('fE').value=v.end;$('fP').value=v.place;
  document.querySelector(`#fK input[value="${v.kind}"]`).checked=true;$('warn').textContent='';
  $('ov').classList.add('open');setTimeout(()=>$('fT').focus(),50);check();
}
function close(){$('ov').classList.remove('open')}
function check(){
  const s=$('fS').value,e=$('fE').value,d=+$('fD').value;
  if(!s||!e)return $('warn').textContent='',true;
  if(m(e)<=m(s)){$('warn').textContent='Giờ kết thúc phải sau giờ bắt đầu.';return false}
  const c=evs.find(x=>x.id!==editId&&x.day===d&&m(x.start)<m(e)&&m(s)<m(x.end));
  $('warn').textContent=c?'Lưu ý: trùng giờ với “'+c.title+'” ('+c.start+'–'+c.end+'). Vẫn có thể lưu.':'';return true;
}
['fS','fE','fD'].forEach(id=>$(id).addEventListener('input',check));
$('f').addEventListener('submit',ev=>{ev.preventDefault();
  const title=$('fT').value.trim();if(!title){$('warn').textContent='Hãy nhập tên hoạt động.';$('fT').focus();return}
  if(!$('fS').value||!$('fE').value){$('warn').textContent='Hãy chọn giờ bắt đầu và kết thúc.';return}
  if(!check())return;
  const o={id:editId||('e'+Date.now()),title,day:+$('fD').value,start:$('fS').value,end:$('fE').value,place:$('fP').value.trim(),kind:document.querySelector('#fK input:checked').value};
  evs=editId?evs.map(x=>x.id===editId?o:x):evs.concat(o);sel=o.day;save();close();render();toast(editId?'Đã cập nhật':'Đã thêm',false);
});
function toast(msg,canUndo){$('tm').textContent=msg;$('undo').style.display=canUndo?'':'none';$('toast').classList.add('open');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('open'),canUndo?6000:2200)}
$('fDel').addEventListener('click',()=>{lastDel=evs.slice();evs=evs.filter(x=>x.id!==editId);save();close();render();toast('Đã xoá',true)});
$('undo').addEventListener('click',()=>{if(lastDel){evs=lastDel;lastDel=null;save();render()}$('toast').classList.remove('open')});
$('fX').addEventListener('click',close);
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('add').addEventListener('click',()=>open(null));
$('vDay').addEventListener('click',()=>{view='day';render()});
$('vWeek').addEventListener('click',()=>{view='week';render()});
$('days').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){sel=+b.dataset.d;render()}});
$('view').addEventListener('click',e=>{
  const b=e.target.closest('[data-id]');if(b){open(evs.find(x=>x.id===b.dataset.id));return}
  if(e.target.id==='emptyAdd'){open(null);return}
  const c=e.target.closest('.col');if(c){const r=c.getBoundingClientRect(),mins=Math.round(((e.clientY-r.top)/PX*60)/30)*30+(+c.dataset.lo)*60;
    const p=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
    open(null,{day:+c.dataset.d,start:p(mins),end:p(Math.min(mins+90,1439))})}
});
$('reset').addEventListener('click',()=>{lastDel=evs.slice();evs=SAMPLE.slice();save();render();toast('Đã khôi phục dữ liệu mẫu',true)});
$('clear').addEventListener('click',()=>{lastDel=evs.slice();evs=[];save();render();toast('Đã xoá hết',true)});
if(innerWidth>900)view='week';
render();setInterval(head,30000);
}</script>
</body></html>
